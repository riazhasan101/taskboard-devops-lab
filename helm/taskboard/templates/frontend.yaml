{{- $ctx := dict "root" . "component" "frontend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tb.name" . }}-frontend
  labels:
    {{- include "tb.labels" . | nindent 4 }}
    {{- include "tb.selector" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "tb.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tb.labels" . | nindent 8 }}
        {{- include "tb.selector" $ctx | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      {{- include "tb.spread" $ctx | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ .Values.image.prefix }}-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.frontend.port }} }
          env:
            - { name: BACKEND_URL, value: "http://{{ include "tb.name" . }}-backend:{{ .Values.backend.port }}" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tb.name" . }}-frontend
  labels:
    {{- include "tb.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tb.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tb.name" . }}-frontend
  labels:
    {{- include "tb.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "tb.selector" $ctx | nindent 6 }}
{{- end }}

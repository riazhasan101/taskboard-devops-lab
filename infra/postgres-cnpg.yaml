# HA Postgres with the CloudNativePG operator (install the operator first, see ROADMAP phase 6).
# 2 instances = 1 primary + 1 streaming replica, automatic failover (fits a 2-worker laptop cluster).
# Use 3 on the 3-worker cluster or a real one.
# Services created by the operator:  taskboard-pg-rw (primary), taskboard-pg-ro (replicas)
# Secret created by the operator:    taskboard-pg-app  (key "uri" is used by the Helm chart)
#
# Object-store backup / PITR (barmanObjectStore + ScheduledBackup) is intentionally NOT here yet.
# It is added in ROADMAP phase 8, once an S3-compatible target is chosen
# (MinIO community images are discontinued, so it is no longer a default choice).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: taskboard-pg
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: taskboard
      owner: app
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred   # use "required" on a real multi-node cluster
    topologyKey: kubernetes.io/hostname
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
